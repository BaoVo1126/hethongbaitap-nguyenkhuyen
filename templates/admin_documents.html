{% extends "base.html" %}
{% block content %}
  {% include "_admin_tabs.html" %}
  <div class="section-label">Tài liệu</div>

  <form class="card-form" method="POST" action="{{ url_for('admin_documents_upload') }}" enctype="multipart/form-data" style="margin-bottom:1.4rem;">
    <label>Tải lên tài liệu tham khảo</label>
    <input type="file" name="document_file" required>
    <button class="btn" type="submit">Tải lên</button>
  </form>

  <div class="board">
    {% if docs %}
      <table class="admin-table">
        <thead><tr><th>Tên tệp</th><th>Ngày tải lên</th><th></th></tr></thead>
        <tbody>
          {% for d in docs %}
            <tr>
              <td><a href="{{ url_for('serve_document', filename=d['stored_filename']) }}">{{ d['original_filename'] }}</a></td>
              <td>{{ d['uploaded_at'] }}</td>
              <td>
                <form method="POST" action="{{ url_for('admin_documents_delete', doc_id=d['id']) }}">
                  <button class="btn small danger" type="submit">Xoá</button>
                </form>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <div class="empty-note">Chưa có tài liệu nào.</div>
    {% endif %}
  </div>
{% endblock %}
